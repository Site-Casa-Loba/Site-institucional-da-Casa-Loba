name: Build (pull request)

# Valida o build em cada pull request. O deploy continua só na main.
# O Astro apenas avisa quando duas páginas disputam a mesma rota, por isso
# a checagem explícita de "Could not render" abaixo.

on:
  pull_request:
    branches: [main]

env:
  # ID público do cliente headless (não é secret) — permite ao build ler o CMS.
  PUBLIC_WIX_CLIENT_ID: 177d2fe1-7c67-4af7-a2e0-482dc527d3aa

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Build e checagem de rotas
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -q "Could not render" "$RUNNER_TEMP/build.log"; then
            echo "::error::Duas páginas disputam a mesma rota (Could not render)."
            exit 1
          fi

      - name: Checar tipos
        run: npm run check
