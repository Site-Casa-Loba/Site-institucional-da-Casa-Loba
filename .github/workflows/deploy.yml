name: Deploy

# Publica o site no Wix Headless a cada push na main.
#
# O site é um "Wix Astro build" server-rendered (páginas pré-renderizadas +
# rotas on-demand em src/pages/api, ex.: /api/webhooks/ticto). Nem o drop
# estático nem o `wix release` do CLI servem — ambos publicam só arquivos e
# derrubam o worker (o webhook volta a 404; verificado em produção). O release
# correto passa pela ferramenta UploadHeadlessWebsiteFiles do Wix MCP
# (https://mcp.wix.com/mcp), autenticado com a chave de API da conta — é o que
# scripts/wix-release.mjs faz.
#
# Secrets necessários (Settings → Secrets → Actions):
#   WIX_API_TOKEN       — chave de API da conta Wix (a da conta casaloba)
#   TICTO_WEBHOOK_TOKEN — token que a Ticto envia no webhook

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-wix
  cancel-in-progress: true

env:
  WIX_SITE_URL: https://www.casaloba.com.br
  # ID público do cliente headless (não é secret) — permite ao build ler o CMS.
  PUBLIC_WIX_CLIENT_ID: 177d2fe1-7c67-4af7-a2e0-482dc527d3aa
  # Exigidas pela integração @wix/astro para gerar os metadados do release.
  # O site usa auth client-side e o webhook não usa essas credenciais, então
  # valores provisórios bastam para o build (nunca versionar segredos reais).
  WIX_CLIENT_ID: 177d2fe1-7c67-4af7-a2e0-482dc527d3aa
  WIX_CLIENT_INSTANCE_ID: ci-placeholder
  WIX_CLIENT_PUBLIC_KEY: ci-placeholder
  WIX_CLIENT_SECRET: ci-placeholder
  # Token que a Ticto envia no webhook; é embutido no bundle server no build.
  # Configure o mesmo valor em Settings → Secrets → Actions.
  TICTO_WEBHOOK_TOKEN: ${{ secrets.TICTO_WEBHOOK_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci

      - name: Checagens (contrato auth + astro check)
        run: npm run check

      - run: npm run build

      # Publica o build server-rendered via Wix MCP autenticado pela chave de
      # API da conta. Requer os secrets WIX_API_TOKEN (chave de API da conta
      # correta) e TICTO_WEBHOOK_TOKEN.
      - name: Publicar build no Wix Headless (release server-rendered)
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_TOKEN }}
          WIX_ACCOUNT_ID: 980d7438-c1dd-4311-9ef1-a414a0dcb54f
        run: node scripts/wix-release.mjs

      # Confere se o ar ficou igual ao build (arquivos do cliente).
      - name: Conferir se o ar é igual ao build
        run: npm run wix:check
