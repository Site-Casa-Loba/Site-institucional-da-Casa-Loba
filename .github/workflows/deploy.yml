name: Build e checagem

# O site é um "Wix Astro build" server-rendered no Wix Headless (páginas
# pré-renderizadas + rotas on-demand em src/pages/api, ex.:
# /api/webhooks/ticto). O release NÃO pode ser feito por este workflow:
#
#  - um drop estático (API headless-business-setup/drop) substituiria o
#    release inteiro e MATARIA o webhook;
#  - `wix release` (Wix CLI) neste projeto publica apenas os arquivos de
#    site.outputDirectory como site estático — o bundle server em dist/server
#    não vira worker e o webhook volta a 404 (verificado em produção).
#
# O release é feito pelo fluxo de upload do Wix MCP (UploadHeadlessWebsiteFiles:
# prepare → PUT no S3 → release com o build de .wix/ + dist/), que mantém o
# site server-rendered. Este workflow então só builda, roda as checagens e
# guarda o dist/ como artifact para conferência.
#
# Com isso o CI não precisa de chave de API do Wix — o secret WIX_API_TOKEN
# pode ser removido do repositório.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-casaloba
  cancel-in-progress: true

env:
  WIX_SITE_URL: https://www.casaloba.com.br
  # ID público do cliente headless (não é secret) — permite ao build ler o CMS.
  PUBLIC_WIX_CLIENT_ID: 177d2fe1-7c67-4af7-a2e0-482dc527d3aa
  # Exigidas pela integração @wix/astro para gerar os metadados do release.
  # O site usa auth client-side e o webhook não usa essas credenciais, então
  # valores provisórios bastam para o build (nunca versionar segredos reais).
  WIX_CLIENT_ID: 177d2fe1-7c67-4af7-a2e0-482dc527d3aa
  WIX_CLIENT_INSTANCE_ID: ci-placeholder
  WIX_CLIENT_PUBLIC_KEY: ci-placeholder
  WIX_CLIENT_SECRET: ci-placeholder
  # Token que a Ticto envia no webhook; é embutido no bundle server no build.
  # Configure o mesmo valor em Settings → Secrets → Actions.
  TICTO_WEBHOOK_TOKEN: ${{ secrets.TICTO_WEBHOOK_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci

      - name: Checagens (contrato auth + astro check)
        run: npm run check

      - run: npm run build

      - name: Guardar dist/ como artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist
            .wix
          retention-days: 7
          if-no-files-found: error
